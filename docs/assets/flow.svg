  <text x="124" y="94" text-anchor="middle" fill="currentColor" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="13">requirements-*.txt</text>
  <text x="368" y="70" text-anchor="middle" fill="currentColor" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700">Four venvs</text>
  <text x="368" y="94" text-anchor="middle" fill="currentColor" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="13">core qwen stt xtts</text>
