# Example template only — NOT included in kustomization.yaml.
# Create the real secret manually with:
#   kubectl -n speech-studio-persona create secret generic persona-secrets \
#     --from-literal=PERSONA_WRITE_TOKEN="<random-strong-token>"
apiVersion: v1
kind: Secret
metadata:
  name: persona-secrets
  namespace: speech-studio-persona
type: Opaque
stringData:
  PERSONA_WRITE_TOKEN: "CHANGE_ME_STRONG_BEARER_TOKEN"
