name: Build test installers

on:
  workflow_dispatch:
    inputs:
      include_windows:
        description: Build the Windows installer too
        type: boolean
        default: true
      version:
        description: Optional version tag override (e.g. v0.2.2)
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      include_windows:
        type: boolean
        default: true
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unix:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            arch_label: amd64
          - os: macos-15
            bundle: dmg
            arch_label: aarch64
          - os: macos-15-intel
            bundle: dmg
            arch_label: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync and verify version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            python scripts/sync_version.py --version "${{ inputs.version }}"
          fi
          python scripts/sync_version.py --check
          VER="$(python -c 'from scripts.sync_version import read_tauri_version; print(read_tauri_version())')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build standalone runtime and resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install uv==0.12.21
          uv venv --managed-python --python 3.12 .packaging/build-env
          uv pip install --python .packaging/build-env/bin/python -r installer/requirements-core.txt -r installer/requirements-stt-cpu.txt
          .packaging/build-env/bin/python scripts/fetch_unix_runtime.py
          .packaging/build-env/bin/python scripts/prepare_unix_payload.py --crispasr-dir .packaging/native/extracted
      - run: npm ci
      - name: Build installer
        run: npx tauri build --bundles ${{ matrix.bundle }} --config installer/tauri.unix.conf.json
      - name: Stage normalized artifact
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          OUT_NAME="SpeechStudio_${VER}_${{ matrix.arch_label }}.${{ matrix.bundle }}"
          FOUND="$(find "src-tauri/target/release/bundle/${{ matrix.bundle }}" -maxdepth 1 -type f -name "*.${{ matrix.bundle }}" | head -n 1)"
          test -n "$FOUND"
          mkdir -p .packaging/dist
          cp "$FOUND" ".packaging/dist/${OUT_NAME}"
          test -s ".packaging/dist/${OUT_NAME}"
          shasum -a 256 ".packaging/dist/${OUT_NAME}" 2>/dev/null || sha256sum ".packaging/dist/${OUT_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: SpeechStudio-${{ matrix.os }}
          path: .packaging/dist/*
          if-no-files-found: error

  windows:
    if: ${{ inputs.include_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync and verify version
        id: ver
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}".Trim()
          if ($override) {
            python scripts/sync_version.py --version $override
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python scripts/sync_version.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = python -c "from scripts.sync_version import read_tauri_version; print(read_tauri_version())"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Prepare installer tools
        shell: pwsh
        run: |
          python -m pip install uv==0.12.21
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }
          exit $LASTEXITCODE
      - name: Native CPU runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\fetch-crispasr.ps1 -Variant cpu
      - name: Build installer
        shell: pwsh
        run: .\installer\windows\build.ps1
      - name: Verify installer output
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $setup = "installer\Output\SpeechStudio_${ver}_Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Missing $setup" }
          Get-FileHash -LiteralPath $setup -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SpeechStudio-Windows-x64
          path: installer/Output/SpeechStudio_${{ steps.ver.outputs.version }}_Setup.exe
          if-no-files-found: error
