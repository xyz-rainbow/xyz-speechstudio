# Publish a GitHub Release when a v* tag is pushed.
# The note in docs/releases/<tag>.md is the body. All platform installers
# (Windows Setup, Linux amd64 .deb, macOS Apple Silicon .dmg, macOS Intel .dmg)
# are built from the same synced tag version and verified via SHA256SUMS.txt
# before the draft release is published.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          TITLE="Speech Studio ${GITHUB_REF_NAME}"
          if [ -f "$NOTES" ]; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
            else
              gh release create "$GITHUB_REF_NAME" \
                --draft \
                --verify-tag \
                --title "$TITLE" \
                --notes-file "$NOTES"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$TITLE"
          fi

  installers:
    needs: release
    uses: ./.github/workflows/build-installers.yml
    with:
      include_windows: true
      version: ${{ github.ref_name }}

  publish:
    name: Verify checksums and publish release
    needs: [release, installers]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: SpeechStudio-*
          path: release-assets
          merge-multiple: true

      - name: Verify required packages and checksums
        id: verify
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER#V}"
          WIN="SpeechStudio_${VER}_Setup.exe"
          DEB="SpeechStudio_${VER}_amd64.deb"
          DMG_ARM="SpeechStudio_${VER}_aarch64.dmg"
          DMG_INTEL="SpeechStudio_${VER}_x64.dmg"
          cd release-assets
          for f in "$WIN" "$DEB" "$DMG_ARM" "$DMG_INTEL"; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty required release package: $f" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum "$WIN" "$DEB" "$DMG_ARM" "$DMG_INTEL" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload packages and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER#V}"
          gh release upload "$GITHUB_REF_NAME" \
            "release-assets/SpeechStudio_${VER}_Setup.exe" \
            "release-assets/SpeechStudio_${VER}_amd64.deb" \
            "release-assets/SpeechStudio_${VER}_aarch64.dmg" \
            "release-assets/SpeechStudio_${VER}_x64.dmg" \
            "release-assets/SHA256SUMS.txt" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
