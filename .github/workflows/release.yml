# Publish a GitHub Release when a v* tag is pushed.
# Source/tag release only. The note in docs/releases/<tag>.md is the
# release body, including what still does not work. Binaries are not uploaded.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Speech Studio ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "Speech Studio ${GITHUB_REF_NAME}"
          fi
