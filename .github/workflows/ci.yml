# CI for Speech Studio.
# Default runners are self-hosted on the homelab k3s cluster (label: k3s)
# so we do not burn GitHub-hosted minutes. macOS checks are deferred.
# Code remains cross-platform (Windows / Linux / macOS cfg paths).
#
# GitHub-hosted fallback (ubuntu/windows) only via workflow_dispatch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_github_hosted:
        description: "Run on GitHub-hosted runners instead of k3s"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ${{ inputs.use_github_hosted && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","k3s"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Vite build
        run: npm run build

  python:
    name: Python lint and test
    runs-on: ${{ inputs.use_github_hosted && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","k3s"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic fastapi httpx huggingface_hub pytest

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Pytest
        run: pytest -q

  rust-linux:
    name: Rust check and build (Linux)
    runs-on: ${{ inputs.use_github_hosted && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","k3s"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: ${{ inputs.use_github_hosted }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo build
        working-directory: src-tauri
        run: cargo build --locked

  # Optional: only when explicitly requested. Windows GitHub-hosted is expensive.
  rust-windows:
    name: Rust check (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_github_hosted }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # macOS: deferred. Keep writing #[cfg(target_os = "macos")] paths; no CI burn for now.
