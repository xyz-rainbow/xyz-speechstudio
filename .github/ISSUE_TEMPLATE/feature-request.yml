name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Hay una plantilla en [español](https://github.com/xyz-rainbow/xyz-speechstudio/issues/new?template=feature-request.es.yml).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do instead? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: OS, GPU, workflows, or related issues.
    validations:
      required: false
