changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - skip-changelog
      - dependencies
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: CI and tooling
      labels:
        - ci
        - github_actions
    - title: Other changes
      labels:
        - "*"
